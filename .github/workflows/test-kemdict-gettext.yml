name: Test @kemdict/gettext
on:
  push:
    paths:
      - "lib/**"
      - "test/**"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"
      - name: Install packages
        run: |
          pnpm install
      - name: Test
        run: |
          make test
